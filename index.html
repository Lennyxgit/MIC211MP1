      else if (c.mid >= H.seuil) { v.className = 'verdict warn'; v.textContent = 'Rentable en estimation centrale'; }
      else if (c.tmax >= H.seuil) { v.className = 'verdict warn'; v.textContent = 'Rentable en hypothèse haute seulement'; }
      else { v.className = 'verdict bad'; v.textContent = 'Pas assez de gisement'; }
      const echelle = Math.max(H.capa, c.tmax, H.seuil) * 1.05, pct = x => Math.min(100, x / echelle * 100);
      $('glo').style.width = pct(c.mid) + '%'; $('ghi').style.width = pct(c.tmax) + '%'; $('gt200').style.left = pct(H.seuil) + '%'; $('gcap').style.left = pct(H.capa) + '%';
      $('gscale').innerHTML = pct(H.capa) - pct(H.seuil) < 28
        ? `<span style="left:${pct(H.seuil)}%">seuil ${fmt0(H.seuil)}, capacité ${fmt0(H.capa)}</span>`
        : `<span style="left:${pct(H.seuil)}%">seuil ${fmt0(H.seuil)}</span><span style="left:${pct(H.capa)}%;${pct(H.capa) > 60 ? 'transform:translateX(-100%)' : ''}">capacité ${fmt0(H.capa)}</span>`;
      const avec = capter(site.lat, site.lon, site.r, true), sans = capter(site.lat, site.lon, site.r, false);
      $('men').checked = CATS_COLLECTE().every(x => state.cats.has(x));
      state.dernier = {avec, sans, c, mois: peindreMois()};
      peindreTop3(c.mid);
    }
    // Les trois producteurs qui apportent le plus, parmi ceux qu'on peut démarcher (les ménages passent par la commune)
    function peindreTop3(total) {
      const top = DATA.filter(o => compte(o) && o.d <= site.r && o.seg !== 'exclu' && !o.inc && o.mid > 0 && o.categorie_id !== 'C01').sort((a, b) => b.mid - a.mid).slice(0, 3);
      const part = t => total ? Math.round(t / total * 100) : 0;
      $('top3').innerHTML = top.map((o, i) => `<li><button class="t3" data-id="${esc(o.id)}"><span class="r">${i + 1}</span><span class="n"><b>${esc(o.name)}</b><small>${esc(o.cat)} · ${BASE_COURTE[o.fiab] || ''}</small></span><span class="v">${fmt(o.mid)} t<small>${part(o.mid)} %</small></span></button></li>`).join('');
      const somme = top.reduce((a, o) => a + o.mid, 0), mots = ['', 'Seul', 'À eux deux', 'À eux trois'];
      $('top3n').textContent = top.length ? `${mots[top.length]} : ${fmt0(somme)} t/an, soit ${part(somme)} % du gisement du rayon${somme >= H.seuil ? ', de quoi dépasser le seuil de rentabilité' : ''}.` : 'Aucun producteur identifié dans le rayon.';
    }
    function rayonUtile() {
      const l = DATA.filter(compte).map(o => [kmTo(site.lat, site.lon, o.lat, o.lon), o.mid]).sort((a, b) => a[0] - b[0]);
      let s = 0; for (const [d, m] of l) { s += m; if (s >= H.seuil) return d <= 5 ? `${fmt(Math.max(d, .1))} km` : 'plus de 5 km'; }
      return 'non atteint';
    }
    function peindreReco() {
      const s = state.plan[state.siteIndex], types = Moteur.TYPES_TERRAIN;
      $('choix').innerHTML = state.plan.length > 1 && !state.manuel ? state.plan.map((_, i) => `<button data-s="${i}" aria-pressed="${i === state.siteIndex}">Site ${i + 1}</button>`).join('') : '';
      const t = state.type;
      const rue = state.fiche?.adresse ? state.fiche.adresse.replace(/^\d+(\s?(bis|ter|[a-zA-Z])\b)?\s*,?\s*/, '').split(',')[0] : '';
      $('recotitre').textContent = t ? (t.type === 'producteur' ? `Sur le site ${/^[aeiouyhéèêàâîôû]/i.test(t.nom) ? 'd’' : 'de '}${t.nom}` : t.nom ? t.nom : types[t.type] + (rue ? `, ${rue}` : '')) : (s || state.manuel ? 'Emplacement libre' + (rue ? `, ${rue}` : '') : 'Aucun terrain trouvé');
      $('recoadr').textContent = state.fiche?.adresse || (state.fiche ? 'Voir sur Google Maps' : '');

    }

        if (f.parcelle) l.push([`Parcelle ${f.parcelle.section} ${f.parcelle.numero}, ${f.parcelle.surface >= 10000 ? fmt(f.parcelle.surface / 10000) + ' ha' : fmt0(f.parcelle.surface) + ' m²'}`, f.parcelle.surface >= P.P19 ? 'ok' : 'warn']);
        if (f.plu) l.push([f.plu.code ? `Zonage ${f.plu.code}` : 'Zonage à vérifier', /^N/.test(f.plu.type || '') ? 'bad' : f.plu.code ? (['U', 'AUc', 'AUs'].includes(f.plu.type) || (f.plu.type === 'A' && t?.type === 'agricole') ? 'ok' : 'warn') : 'warn']);
        if (f.habitation) l.push([f.habitation.auDela ? 'Habitations à plus de 300 m' : `Habitation à ${f.habitation.distance} m`, f.habitation.auDela || f.habitation.distance >= H.recul ? 'ok' : 'bad']);
        if (f.inondation?.zone) l.push(['Zone inondable à vérifier', 'warn']);

      $('fiche').innerHTML = l.map(([x, c]) => `<li class="${c}">${esc(x)}</li>`).join('');
    }
    // Part du tonnage du rayon qui repose sur une taille connue (effectif, population) plutôt que sur une moyenne
    function fiabilite() {
      const manque = [!meta.sireneComplet && 'SIRENE', !meta.ignComplet && 'IGN'].filter(Boolean);
      if (manque.length) return [`${manque.join(' et ')} indisponible${manque.length > 1 ? 's' : ''} : données partielles`, 'bad'];
      if (!meta.osmComplet) return ['Compléments OpenStreetMap en attente : données partielles', 'warn'];
      let tout = 0, sur = 0;
      for (const o of DATA) if (compte(o) && o.d <= site.r) { tout += o.mid; if (COLLECTE(o) || o.fiab === 'base' || o.fiab === 'effectif') sur += o.mid; }
      const pct = tout ? Math.round(sur / tout * 100) : 0;
      return [`Taille connue pour ${pct} % du tonnage`, pct >= 60 ? 'ok' : 'warn'];
    }
    const terrainEn = (lat, lon) => {
      const t = BASE.terrains.filter(x => Moteur.dansAnneau(lon, lat, x.poly)).sort((a, b) => ({zone: 0, friche: 1, parking: 2, agricole: 3}[a.type] - {zone: 0, friche: 1, parking: 2, agricole: 3}[b.type]))[0];
      return t ? {type: t.type, nom: t.nom, surface: t.surface} : null;
    };
    let jetonFiche = 0;
    async function qualifier(lat, lon) {
      const j = ++jetonFiche; state.fiche = null; state.ficheDe = [lat, lon]; peindreReco();
      const f = await Moteur.ficheSite(lat, lon, meta.pays, params2(), BASE);

    }

    // ---- recherche du site
    function candidats() {
      if (!state.cand) state.cand = Moteur.preparerSites(BASE, DATA.filter(o => o.seg !== 'exclu'), params2(), meta.rayon ? [meta.centre[0], meta.centre[1], meta.rayon] : null);
      return state.cand;
    }
    async function trouverSite() {
      state.manuel = false; state.exclus = new Set(); state.siteIndex = 0;
      state.plan = Moteur.planDeSites(candidats(), DATA, site.r, o => state.cats.has(o.cat) && o.mid > 0, params2());
      if (!state.plan.length) { state.type = null; state.fiche = null; peindreReco(); maj(); return; }
      await allerAuSite(0);
    }
    async function allerAuSite(i) {
      state.siteIndex = i; state.manuel = false;

      const s = state.plan[i], essais = [s, ...s.classement].slice(0, 12);

      poser(essais[0]); state.fiche = null; state.ficheDe = [site.lat, site.lon]; dessinerSite(); maj();

      for (let k = 0; k < essais.length; k += 4) {
        const lot = essais.slice(k, k + 4);

        if (j !== jetonFiche) return; // l'utilisateur a choisi autre chose entre-temps

    function placerManuel(lat, lon, redessiner) {
      site.lat = lat; site.lon = lon; state.manuel = true; state.exclus = new Set(); state.type = terrainEn(lat, lon);
      if (redessiner) dessinerSite();
      maj(); qualifier(lat, lon);
    }
    function maj() { peindreSite(); peindreSegs(); rafraichirCarte(); peindreListe(); dessinerChaleur(); peindreReco(); }

    let ficheOuverte = false;
    map.on('preclick', () => { ficheOuverte = !!document.querySelector('.leaflet-popup'); });

         <li><span class="k">1 à 5 km</span><span>Rayon de collecte, contre 50 à 60 km aujourd'hui.</span></li>
         <li><span class="k">Exclus</span><span>Supermarchés, supérettes, stations-service : trop de plastique.</span></li>
        </ul><p class="note">${loi}</p>
       </div></details>
       <details class="acc"><summary>Fiabilité des chiffres</summary><div>
        <p>Tonnage = taille × ratio. Les tailles viennent, par ordre de fiabilité, d'un chiffre réel (habitants, lits), de l'effectif SIRENE, ou d'une valeur moyenne de la catégorie.</p>
        <p class="note">Adresses : ${st('registre')} du registre officiel, ${st('confirmee')} confirmées, ${st('deduite')} déduites, ${adr} à vérifier. L'existence de l'établissement n'est pas contrôlée.</p>
       </div></details>
       <details class="acc"><summary>Sources</summary><div><ul class="srcs">${li(meta.pays === 'FR' ? srcs : srcsLU)}${li(refs)}</ul></div></details>`;
      $('datation').innerHTML = `Données du ${new Date(meta.date).toLocaleDateString('fr-FR')}${meta.instantane ? `, OpenStreetMap du ${new Date(meta.instantane).toLocaleDateString('fr-FR')}` : ''}. <button class="link" id="actualiser">Actualiser</button>`;
      $('actualiser').addEventListener('click', () => { const u = new URL(location.href); u.searchParams.set('actualiser', '1'); location.href = u.href; });
    }
    function miniCarte() {
      const k = Math.cos(meta.centre[0] * Math.PI / 180), l = 318, h = 205;
      const ring = BASE.ring.length ? BASE.ring : [];
      const cercle = Array.from({length: 40}, (_, a) => [site.lon + site.r / 111.32 / k * Math.cos(a / 20 * Math.PI), site.lat + site.r / 110.57 * Math.sin(a / 20 * Math.PI)]);
      const tous = [...ring, ...cercle], xs = tous.map(p => p[0]), ys = tous.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), e = Math.min((l - 10) / ((x1 - x0) * k), (h - 10) / (y1 - y0));
      const xy = (x, y) => `${(5 + (x - x0) * k * e).toFixed(1)},${(h - 5 - (y - y0) * e).toFixed(1)}`;
      const ch = p => 'M' + p.map(([x, y]) => xy(x, y)).join(' L');
      const pts = DATA.filter(o => compte(o) && [1, 2].includes(prioDe(o)) && o.key !== 'collectivite').sort((a, b) => prioDe(b) - prioDe(a)).map(o => { const [x, y] = xy(o.lon, o.lat).split(','); return `<circle cx="${x}" cy="${y}" r="${Math.min(6, 1.6 + Math.sqrt(o.mid) * .8).toFixed(1)}" fill="${prioDe(o) === 1 ? '#c8481a' : '#6b8794'}" stroke="#fff" stroke-width=".5"/>`; }).join('');
      const [sx, sy] = xy(site.lon, site.lat).split(',');
      return `<svg viewBox="0 0 ${l} ${h}" width="${l}" height="${h}">${ring.length ? `<path d="${ch(ring)} Z" fill="#17201b" fill-opacity=".04" stroke="#8b958e" stroke-width=".8"/>` : ''}<path d="${ch(cercle)} Z" fill="none" stroke="#17201b" stroke-width=".7" stroke-dasharray="3 3"/>${pts}<circle cx="${sx}" cy="${sy}" r="4.5" fill="#17201b" stroke="#fff" stroke-width="1.5"/></svg>`;
    }
    $('imprimer').addEventListener('click', async e => {
      const b = e.currentTarget, lbl = b.textContent;
      if (!state.fiche) { b.textContent = 'Contrôle du terrain…'; for (let i = 0; i < 40 && !state.fiche; i++) await new Promise(r => setTimeout(r, 250)); b.textContent = lbl; }
      const {avec, sans, c} = state.dernier, compteT = DATA.filter(o => compte(o) && o.d <= site.r);
      const top = compteT.filter(o => o.key !== 'collectivite' && !/^verts/.test(o.id)).sort((a, b) => b.sc - a.sc).slice(0, 9);
      const gr = {}; for (const o of compteT) { const [n, t] = gr[o.groupe] || [0, 0]; gr[o.groupe] = [n + 1, t + o.mid]; }
      $('note').innerHTML = `<h1>Gisements de biodéchets et site de l’unité : ${esc(meta.ville)}</h1>
       <div class="sub">Rayon de ${fmt(site.r)} km autour du site, ${fmt0(meta.population)} habitants dans ${meta.rayon ? 'la zone' : 'la commune'}. Recensement du ${new Date(meta.date).toLocaleDateString('fr-FR')}.</div>
       <div class="kpis"><div class="kpi"><b>${fmt0(c.mid)} t</b><span>par an dans le rayon (${fmt0(c.tmin)} à ${fmt0(c.tmax)})</span></div><div class="kpi"><b>${rayonUtile()}</b><span>rayon pour atteindre ${fmt0(H.seuil)} t/an</span></div><div class="kpi"><b>${fmt0(avec.mid)} t</b><span>avec ménages et espaces verts</span></div><div class="kpi"><b>${c.n}</b><span>producteurs comptés, à ${fmt(c.dmoy)} km en moyenne</span></div></div>
       <div class="cols"><div>
        <h2>Site proposé</h2><table>${lignesSite().map(([a, b]) => `<tr><td class="m">${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table>
        <h2>À démarcher en premier</h2><table><tr><th>Score</th><th>Producteur</th><th>t/an</th></tr>${top.map(o => `<tr><td class="n"><b>${o.sc}</b></td><td>${esc(o.name)}<div class="m">${esc(o.cat)} · ${esc(o.addr || 'adresse à trouver')}</div></td><td class="n">${tonTxt(o).replace(' t', '')}</td></tr>`).join('')}</table>
       </div><div>
        <h2>Où sont-ils ?</h2>${miniCarte()}
        <h2>Gisement dans le rayon</h2><table><tr><th>Groupe</th><th class="n">Nb</th><th class="n">t/an</th></tr>${Object.entries(gr).sort((a, b) => b[1][1] - a[1][1]).map(([g, [n, t]]) => `<tr><td>${esc(g)}</td><td class="n">${n}</td><td class="n">${t ? fmt0(t) : 'à demander'}</td></tr>`).join('')}</table>
       </div></div>
       <h2>Hypothèses et limites</h2><ul><li>Tonnage = taille × ratio : ADEME 2022 (restaurants 0,14 kg/repas, santé 0,08, scolaire 0,10), GNR/ADEME 2011 (restauration rapide 0,043 kg/ticket). Tailles : effectif SIRENE, lits, population, ou moyenne de la catégorie. Tout est à confirmer auprès des producteurs.</li><li>Le terrain est contrôlé sur les données publiques (zonage, habitation, inondation) : disponibilité et autorisations restent à vérifier sur place.</li></ul>
       <h2>Prochaines étapes</h2><ul><li>Demander à la collectivité le tonnage réel de la collecte des biodéchets et le contrat en cours.</li><li>Appeler les priorités 1 : repas par jour, prestataire actuel, intérêt pour une collecte de proximité.</li><li>Rencontrer la mairie et le propriétaire du terrain proposé.</li></ul>
       <div class="pied">Sources : ${meta.pays === 'FR' ? 'IGN, SIRENE, Éducation nationale, Géorisques, Base Adresse Nationale, ' : 'geoportail.lu, '}OpenStreetMap (ODbL), ADEME.</div>`;
      window.print();
    });

    // ---- Excel
    const chargerXLSX = () => window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = ko; document.head.appendChild(s); });
    async function exporter(e) {
      const b = e.currentTarget, lbl = b.textContent; b.textContent = 'Préparation…'; b.disabled = true;
      try {
        const X = await chargerXLSX(), r1 = x => Math.round(x * 10) / 10, {c} = state.dernier;
        const lignes = [...DATA].sort(TRIS.prio);
        const entete = ['Rang', 'Priorité', 'Score /100', 'Suivi', 'Nom', 'Catégorie', 'Groupe', 'NAF', 'NACE', 'Biodéchets', 'Compatibilité', 'Disponibilité', 'Taille', 'Base de la taille', 'ID hypothèse', 't/an bas', 't/an central', 't/an haut', 'Distance au site (km)', 'Dans le rayon', 'Téléphone', 'Adresse', 'Fiabilité adresse', 'Source', 'SIRET', 'Remarques', 'Latitude', 'Longitude'];
        const hyp = REF.hypotheses, nh = hyp.length + 1;
        const f = (i, col) => `IFERROR(ROUND(M${i}*INDEX('Hypothèses'!$${col}$2:$${col}$${nh},MATCH(O${i},'Hypothèses'!$A$2:$A$${nh},0))/1000,1),0)`;
        const ws2 = X.utils.aoa_to_sheet([entete, ...lignes.map((o, k) => [k + 1, prioDe(o) ? `Priorité ${prioDe(o)}` : 'Exclu', o.sc, SUIVI[suivi[o.id] || ''], o.name, o.cat, o.groupe, o.naf || '', o.nace, o.waste, o.compat, CAL[o.prof].label, o.taille ?? '', o.taille_txt || '', o.id_hypothese, 0, 0, 0, r1(o.d), o.d <= site.r ? 'oui' : 'non', o.phone || '', o.addr || '', ST_LABEL[o.status] || '', o.source, o.siret || '', o.notes.join(' | '), o.lat, o.lon])]);
        lignes.forEach((o, k) => { const i = k + 2; [['P', 'E', o.tmin], ['Q', 'F', o.tmid ?? o.mid], ['R', 'G', o.tmax]].forEach(([cc, col, v]) => { ws2[`${cc}${i}`] = {t: 'n', v, f: f(i, col)}; }); });
        ws2['!cols'] = [6, 11, 8, 13, 36, 32, 24, 9, 8, 34, 22, 26, 9, 44, 9, 8, 9, 8, 10, 8, 16, 42, 24, 22, 15, 60, 10, 10].map(w => ({wch: w}));
        ws2['!autofilter'] = {ref: ws2['!ref']};
        const ws1 = X.utils.aoa_to_sheet([['Gisements de biodéchets et site de l’unité', meta.ville], ['Recensement du', new Date(meta.date).toLocaleDateString('fr-FR')], [], ...lignesSite(), ['Rayon de collecte (km)', site.r], [], ['Tonnage captable, central (t/an)', Math.round(c.mid)], ['Tonnage captable, bas (t/an)', Math.round(c.tmin)], ['Tonnage captable, haut (t/an)', Math.round(c.tmax)], ['Producteurs comptés dans le rayon', c.n], ['Seuil de rentabilité (t/an)', H.seuil], ['Capacité d\'une unité (t/an)', H.capa], ['Ménages (kg/hab/an)', `${H.kmin} à ${H.kmax}`], ['Ménages et espaces verts comptés', state.cats.has(CATS_COLLECTE()[0]) ? 'oui' : 'non'], [], ['Avertissement', 'Tonnages estimés à partir de ratios : à confirmer auprès des producteurs. Terrain contrôlé sur données publiques : disponibilité à vérifier.']]);
        ws1['!cols'] = [{wch: 36}, {wch: 70}];
        const colsH = ['id_hypothese', 's_applique_a', 'unite_indicateur', 'ratio_bas_kg', 'ratio_central_kg', 'ratio_haut_kg', 'unite_ratio', 'fiabilite', 'sources'];
        const ws3 = X.utils.aoa_to_sheet([colsH, ...hyp.map(h => colsH.map(k => k.startsWith('ratio') && h[k] !== '' ? parseFloat(h[k]) : h[k]))]);
        ws3['!cols'] = [10, 50, 16, 12, 12, 12, 18, 26, 14].map(w => ({wch: w}));
        const wb = X.utils.book_new();
        X.utils.book_append_sheet(wb, ws1, 'Synthèse'); X.utils.book_append_sheet(wb, ws2, 'Producteurs'); X.utils.book_append_sheet(wb, ws3, 'Hypothèses');
        X.writeFile(wb, `gisements-${meta.ville.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-')}.xlsx`, {compression: true});
        b.textContent = 'Fichier téléchargé';
      } catch { b.textContent = 'Téléchargement impossible, vérifiez la connexion'; }
      setTimeout(() => { b.textContent = lbl; b.disabled = false; }, 2500);
    }
    $('xlsx2').addEventListener('click', exporter);

    // ---- démarrage
    cote(); peindreCats(); peindreMethode(); dessinerSite(); dessinerPoints(); maj();
    const sauver = () => { if (meta.osmComplet && (meta.pays !== 'FR' || (meta.sireneComplet && meta.ignComplet))) memoEcrire(cle, {meta, items: DATA.map(({mid, w, wsum, d, sc, ...o}) => o), base: BASE}); };
    trouverSite();
    const etat = t => { $('etat').hidden = !t; $('etat').textContent = t || ''; };
    const controler = async () => {
      if (!DATA.some(o => o.status === 'attente')) { sauver(); return; }
      etat('Contrôle des adresses…');
      await Moteur.verifierAdresses(DATA, meta.ville, P, (f, n) => { if (f % 20 === 0 || f === n) etat(`Contrôle des adresses : ${f} sur ${n}`); });
      cote(); peindreMethode(); peindreListe(); rafraichirCarte(); peindreSegs();
      etat(osmTard && !meta.osmComplet ? 'Compléments en cours de chargement…' : '');
      sauver();
    };
    if (osmTard) {
      etat('Compléments en cours de chargement…');
      osmTard.then(r => {
        if (!r) { etat(''); peindreMethode(); return; }
        const avant = DATA.length, statuts = new Map(DATA.map(o => [o.id, [o.status, o.addr, o.dist]]));
        DATA = r.items; BASE = r.base;
        for (const o of DATA) { const s = statuts.get(o.id); if (s && s[0] !== 'attente') { o.status = s[0]; o.addr = s[1]; o.dist = s[2]; Moteur.calculerScore(o, P); } }
        const horsDef = new Set(ALL_CATS.filter(c => !state.cats.has(c)));
        indexer(); state.cats = new Set(ALL_CATS.filter(c => !horsDef.has(c) && (state.cats.has(c) || CAT_SEG[c] !== 'exclu')));
        state.cand = null; appliquerRatios(); cote();
        dessinerFond(); peindreCats(); dessinerPoints(); peindreMethode();
        if (!state.manuel) trouverSite(); else maj();
        etat(`OpenStreetMap ajouté : ${Math.max(0, DATA.length - avant)} lieux de plus`);
        setTimeout(() => etat(''), 4000);
        controler();
      });
    }
    controler();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { dessinerFond(); dessinerPoints(); dessinerSite(); maj(); });
    new MutationObserver(() => { dessinerFond(); dessinerPoints(); dessinerSite(); maj(); }).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
    window.__outil = {DATA: () => DATA, state, site, trouverSite}; // pour les tests automatiques
  }

  // ---------------------------------------------------------------- démarrage
  const cible = cibleDepuisUrl();
  if (cible) initChargement(cible); else initAccueil();
})();
</script>
