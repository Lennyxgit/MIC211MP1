<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIC211MP1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout : une page de recherche, puis la carte plein écran et un panneau qui répond à « où installer, et qui appeler ». L'orange et la taille des points font ressortir les gros producteurs. */
:root{
 --bg:#eef0ec; --surface:#fbfcfa; --sunk:#f2f4f0; --ink:#17201b; --muted:#6a756e; --line:#e3e6e0;
 --accent:#17694e; --p1:#c8481a; --p2:#6b8794; --p3:#c5c9c4; --site:#17201b; --exclu:#b9bdb7;
 --ok:#17694e; --warn:#a56a00; --bad:#b23a2c;
 --map-bg:#eef0ec; --road:#ffffff; --road-major:#ffffff; --wood:#e2e8dc; --indus:#e6e5e1; --rail:#cfd2cc; --border:#8b958e;
 --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#111512; --surface:#161b18; --sunk:#1c221e; --ink:#e7ece8; --muted:#8f9b93; --line:#262d29;
 --accent:#62cfa4; --p1:#f07a3e; --p2:#7f9ba8; --p3:#49504c; --site:#e7ece8; --exclu:#4b524d;
 --ok:#62cfa4; --warn:#e0ac4c; --bad:#ee8171;
 --map-bg:#111512; --road:#232a26; --road-major:#2f3833; --wood:#17201a; --indus:#1d2220; --rail:#2a312d; --border:#5c6861; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#111512; --surface:#161b18; --sunk:#1c221e; --ink:#e7ece8; --muted:#8f9b93; --line:#262d29;
 --accent:#62cfa4; --p1:#f07a3e; --p2:#7f9ba8; --p3:#49504c; --site:#e7ece8; --exclu:#4b524d;
 --ok:#62cfa4; --warn:#e0ac4c; --bad:#ee8171;
 --map-bg:#111512; --road:#232a26; --road-major:#2f3833; --wood:#17201a; --indus:#1d2220; --rail:#2a312d; --border:#5c6861; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 404px;height:100%;min-height:560px}
.mapbox{position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--map-bg);cursor:crosshair}
.panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;--gr:max(24px,env(safe-area-inset-right,0px));--gl:24px}
.head{padding:22px var(--gr) 0 var(--gl)}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h2{font-size:13px;font-weight:600}
.tabs{display:flex;gap:15px;padding:14px var(--gr) 0 var(--gl);border-bottom:1px solid var(--line)}
.tab{flex:none;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);padding:0 0 9px;cursor:pointer;font-size:13.5px;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tp{flex:1;min-height:0;overflow-y:auto;padding:22px var(--gr) 28px var(--gl);display:flex;flex-direction:column;gap:26px}

/* Site */
.hero{display:flex;flex-direction:column;gap:10px}
.big{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.big b{font-size:38px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:proportional-nums}
.big span{color:var(--muted)}
.verdict{display:flex;gap:7px;align-items:baseline;font-size:13.5px}
.verdict::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor;transform:translateY(-1px)}
.verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.bad{color:var(--bad)}
.gauge{position:relative;height:14px;margin-top:2px}
.track{position:absolute;inset:5px 0 auto 0;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lo,.hi{position:absolute;top:0;bottom:0;left:0}
.hi{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.lo{background:var(--accent)}
.tick{position:absolute;top:1px;height:12px;width:1.5px;background:var(--ink)}
.tick.cap{background:var(--muted)}
.gscale{position:relative;height:15px;font-size:11.5px;color:var(--muted)}
.gscale span{position:absolute;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats dt{color:var(--muted);font-size:12px}
.stats dd{font-size:17px;font-weight:500;letter-spacing:-.01em}
.block{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.range{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.range label{font-weight:500}
.range output{min-width:4ch;text-align:right}
input[type=range]{accent-color:var(--ink);width:100%;min-width:0;margin:0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked{background:var(--ink)}
.sw input:checked::after{transform:translateX(12px)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left;align-self:flex-start}
.link:hover{color:var(--ink);text-decoration-color:currentColor}
.btn{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.heatleg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.heatleg i{flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--p1) 10%,transparent),var(--p1))}
.mchart svg{display:block;width:100%;height:auto;overflow:visible}
.mchart .col{cursor:pointer}
.mchart .col:hover .bg{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.mchart text{font-family:var(--f-body);font-size:10.5px;fill:var(--muted)}
.mchart .lab{fill:var(--ink)}

/* Producteurs */
#p-list{padding:0;gap:0}
.lhead{padding:14px var(--gr) 12px var(--gl);display:flex;flex-direction:column;gap:10px;background:var(--surface);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
.lrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search],input[type=number]{font-size:13px;border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 9px;min-width:0}
input[type=search]{flex:1 1 100%}
select{flex:1 1 110px}
.pick{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.pick input{accent-color:var(--ink);margin:0}
.lcount{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.item{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:11px;padding:10px var(--gr) 10px var(--gl);border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.item:hover,.item.sel{background:var(--sunk)}
.item.out{opacity:.5}
.pd{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--exclu)}
.pd.p1{background:var(--p1)}.pd.p2{background:var(--p2)}.pd.p3{background:var(--p3)}
.item .n{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t{text-align:right;white-space:nowrap;font-weight:500}
.item .s{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.warnflag{color:var(--warn)}
.sv{font-size:11.5px;font-weight:500;margin-left:6px}
.sv-contacte{color:var(--muted)}.sv-interesse{color:var(--ok)}.sv-refus{color:var(--bad)}
.empty{padding:28px var(--gl);color:var(--muted)}

/* Réglages */
.hyp{display:grid;grid-template-columns:minmax(0,1fr) 5rem;gap:8px 12px;align-items:center}
.hyp input{width:100%;text-align:right}
.cgrp{border-bottom:1px solid var(--line)}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;padding:4px 0;cursor:pointer}
.crow.g{padding:8px 0;cursor:default;font-weight:500}
.gname{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;display:flex;gap:6px;align-items:baseline;min-width:0}
.gname::after{content:"+";color:var(--muted);font-weight:400}
.gname[aria-expanded="true"]::after{content:"–"}
.csub{padding:0 0 8px 23px;font-size:13px}
.crow input{accent-color:var(--ink);width:14px;height:14px;margin:0}
.crow .c{color:var(--muted)}
.crow .t{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* Méthode */
.notes{display:flex;flex-direction:column}
.acc{border-bottom:1px solid var(--line)}
.acc:first-child{border-top:1px solid var(--line)}
.acc summary{cursor:pointer;font-weight:500;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--muted)}
.acc[open] summary::after{content:"–"}
.acc>div{padding:0 0 16px;display:flex;flex-direction:column;gap:9px;font-size:13px}
.acc li{margin-bottom:7px}
.acc li:last-child{margin-bottom:0}
.crit li{display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:10px}
.crit .k{font-weight:500}
.srcs a{color:var(--ink);text-underline-offset:2px;text-decoration-color:var(--line)}
.srcs span{display:block;color:var(--muted);font-size:12.5px}

/* Légende posée sur la carte */
.legend{position:absolute;z-index:1000;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;max-width:calc(100% - 32px);display:flex;flex-wrap:wrap;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg{display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.seg:hover{background:var(--sunk)}
.seg .c{color:var(--muted)}
.seg[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.seg[aria-pressed="false"] .pd{opacity:.3}
.seg .pd{margin:0}

/* Leaflet essentiel (inline, la feuille officielle ne peut pas être chargée) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;font-family:var(--f-body);-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:crosshair}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-top .leaflet-control{margin-top:16px}.leaflet-left .leaflet-control{margin-left:max(16px,env(safe-area-inset-left,0px))}.leaflet-right .leaflet-control{margin-right:10px;float:right}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-bar{border-radius:9px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.leaflet-bar a{display:block;width:30px;height:30px;line-height:28px;text-align:center;text-decoration:none;color:var(--ink);font-size:17px;border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a:hover{background:var(--sunk)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);font-size:10.5px;padding:1px 6px}
.leaflet-control-attribution a{color:inherit}
.leaflet-popup{position:absolute;text-align:left;margin-bottom:12px}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(10,20,15,.16)}
.leaflet-popup-content{margin:14px 16px;font-size:13.5px;line-height:1.45;min-width:236px;max-height:min(60vh,420px);overflow-y:auto}
.leaflet-popup-tip-container{width:28px;height:14px;position:absolute;left:50%;margin-left:-14px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:12px;height:12px;padding:1px;margin:-7px auto 0;transform:rotate(45deg);background:var(--surface);border:1px solid var(--line)}
.leaflet-popup-close-button{position:absolute;top:8px;right:10px;border:none;background:none;color:var(--muted);font-size:18px;text-decoration:none;cursor:pointer}
.site-ic{background:none;border:0}
.site-ic div{width:18px;height:18px;border-radius:50%;background:var(--site);border:3px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.35);cursor:grab}
.pill-ic{background:none;border:0}
.pill-ic div{transform:translate(-50%,-50%);white-space:nowrap;font:500 11px/1.2 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;cursor:pointer}
.pill-ic.out div{opacity:.5}

/* Fiche d'un producteur */
.pp{display:flex;flex-direction:column;gap:9px}
.pp h3{font-size:15px;font-weight:600;line-height:1.25;padding-right:14px}
.pp .c{font-size:12.5px;color:var(--muted);margin-top:2px}
.pp .ton{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pp .ton b{font-size:20px;font-weight:500;letter-spacing:-.02em}
.pp .ton span{color:var(--muted);font-size:12.5px}
.pp .prio{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin-left:auto}
.pp .prio .pd{margin:0}
.pp .warnflag{font-size:12.5px}
.pp .suivi{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pp .suivi select{flex:1}
.pp .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.pp a{color:var(--muted);font-size:12.5px;text-underline-offset:3px;text-decoration-color:var(--line)}
.pp a:hover{color:var(--ink)}
.pp details{border-top:1px solid var(--line);padding-top:8px}
.pp summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.pp details>div{display:flex;flex-direction:column;gap:6px;padding-top:8px;font-size:12.5px;color:var(--muted)}
.pp details ul{display:flex;flex-direction:column;gap:4px}
.pp details b{color:var(--ink);font-weight:500}

@media (max-width:900px){
 html,body{height:auto}
 .app{display:block;height:auto;min-height:0}
 .mapbox{height:56svh;min-height:340px}
 .panel{border-left:0;border-top:1px solid var(--line);--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
 .tp{overflow:visible}
 .lhead{position:static}
 .leaflet-right .leaflet-control{margin-right:max(4px,env(safe-area-inset-right,0px))}
 .legend{bottom:24px}
 .tabs{overflow-x:auto;scrollbar-width:none}
 .tab{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){.leaflet-zoom-anim .leaflet-zoom-animated{transition:none}.sw input,.sw input::after{transition:none}}

/* Accueil */
.vue-page{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface)}
.bloc{width:min(560px,100%);display:flex;flex-direction:column;gap:18px}
.marque{font-size:13px;color:var(--muted)}
.accueil-titre{font-size:clamp(30px,5vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.accueil-texte{color:var(--muted);font-size:15px;max-width:48ch}
.recherche{position:relative}
.recherche input{width:100%;font-size:17px;padding:14px 16px;border:1px solid var(--muted);border-radius:10px;background:var(--surface);color:var(--ink)}
.recherche input:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.suggestions{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:2000;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,15,.14);overflow:hidden}
.sug{display:flex;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:0;padding:11px 16px;cursor:pointer;font-size:15px}
.sug:hover,.sug[aria-selected="true"]{background:var(--sunk)}
.sug span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recents{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:baseline}
.erreur{color:var(--bad);font-size:13.5px}
/* Chargement */
.etapes{display:flex;flex-direction:column;gap:12px}
.etape{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:baseline;color:var(--muted)}
.etape::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);transform:translateY(-1px)}
.etape.en-cours{color:var(--ink)}.etape.en-cours::before{background:var(--p1);animation:pouls 1s ease-in-out infinite}
.etape.fait{color:var(--ink)}.etape.fait::before{background:var(--ok)}
.etape.alerte::before{background:var(--warn)}
.etape small{display:block;color:var(--muted);font-size:12.5px}
@keyframes pouls{50%{opacity:.3}}
/* En-tête du panneau et site recommandé */
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.etat{padding:6px var(--gr) 0 var(--gl);font-size:12px;color:var(--muted)}
.reco{display:flex;flex-direction:column;gap:4px}
.reco .lab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.reco h2{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.reco p{font-size:13px;color:var(--muted)}
.choix{display:flex;gap:10px}
.choix button{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;cursor:pointer}
.choix button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.fiche{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;font-size:13px;margin:0}
.fiche dt{color:var(--muted)}
.fiche dd{margin:0;display:flex;gap:7px;align-items:baseline}
.fiche dd::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--line);transform:translateY(-1px)}
.fiche dd.ok::before{background:var(--ok)}.fiche dd.warn::before{background:var(--warn)}.fiche dd.bad::before{background:var(--bad)}
.exports{display:flex;gap:14px;flex-wrap:wrap}
.vue-aerienne{position:absolute;z-index:1000;top:16px;right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.vue-aerienne:hover{background:var(--sunk)}
.vue-aerienne[aria-pressed="true"]{border-color:var(--ink)}
.leaflet-tile{visibility:hidden;max-width:none!important}.leaflet-tile-loaded{visibility:inherit}.leaflet-tile-pane{z-index:200}
.leaflet-container img{max-width:none!important}
/* Note imprimable */
#note{display:none}
@media print{
 @page{size:A4;margin:12mm 13mm}
 html,body{height:auto;background:#fff;color:#17201b}
 #accueil,#chargement,#app{display:none!important}
 #note{display:block;font-size:9pt;line-height:1.34;color:#17201b}
 #note h1{font-size:16pt;margin:0 0 2px}#note h2{font-size:10.5pt;margin:9px 0 4px}
 #note .sub{color:#5d6b61;font-size:8.5pt;border-bottom:1.5pt solid #17201b;padding-bottom:4px;margin-bottom:8px}
 #note .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
 #note .kpi{border:1px solid #d3dbd2;border-radius:5px;padding:5px 7px}#note .kpi b{display:block;font-size:13pt;font-weight:600}#note .kpi span{font-size:7.8pt;color:#5d6b61}
 #note .cols{display:grid;grid-template-columns:1fr 84mm;gap:10px;align-items:start}
 #note table{border-collapse:collapse;width:100%}#note th{text-align:left;font-size:7.8pt;color:#5d6b61;border-bottom:1px solid #b7c4b7;padding:2px 4px;font-weight:600}
 #note td{border-bottom:1px solid #e3e8e2;padding:2px 4px;vertical-align:top}#note td.n{text-align:right;white-space:nowrap}#note .m{font-size:7.5pt;color:#5d6b61}
 #note ul{margin:3px 0;padding-left:14px;list-style:disc}#note li{margin:1px 0}
 #note .pied{margin-top:8px;border-top:1px solid #d3dbd2;padding-top:4px;font-size:7.5pt;color:#5d6b61}
}
@media (max-width:900px){.vue-aerienne{top:12px}}

/* ---------- Passe finale ---------- */
:root{--p1:#d24a14;--p2:#5f7f8f;--p3:#c9cdc8;--ombre:0 1px 2px rgba(15,25,20,.06),0 12px 40px rgba(15,25,20,.12);--rayon:16px;--sunk:#f1f3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1210;--surface:#141916;--sunk:#1b211d;--line:#242b27;--p1:#f47c3c;--p2:#86a4b2;--p3:#454d48;--map-bg:#0e1210;--wood:#141c17;--indus:#1a1f1c;--road:#1f2622;--road-major:#2c3530;--ombre:0 1px 2px rgba(0,0,0,.4),0 16px 48px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0e1210;--surface:#141916;--sunk:#1b211d;--line:#242b27;--p1:#f47c3c;--p2:#86a4b2;--p3:#454d48;--map-bg:#0e1210;--wood:#141c17;--indus:#1a1f1c;--road:#1f2622;--road-major:#2c3530;--ombre:0 1px 2px rgba(0,0,0,.4),0 16px 48px rgba(0,0,0,.45)}
html{scrollbar-color:var(--line) transparent;scrollbar-width:thin}
/* carte plein écran, panneau flottant */
.app{display:block;position:relative;height:100%;min-height:560px}
.mapbox{position:absolute;inset:0}
.panel{position:absolute;z-index:1100;top:14px;right:14px;bottom:14px;width:408px;border:1px solid var(--line);border-radius:var(--rayon);box-shadow:var(--ombre);overflow:hidden;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.leaflet-bottom.leaflet-right{right:430px}
.head{padding-top:20px;align-items:center}
h1#ville{font-size:24px;letter-spacing:-.025em}
.etat{padding-top:2px}
/* onglets : une commande segmentée */
.tabs{margin:14px var(--gr) 0 var(--gl);padding:3px;gap:2px;background:var(--sunk);border:0;border-radius:10px}
.tab{flex:1 1 auto;margin:0;padding:6px 4px;border:0;border-radius:8px;font-size:13px;text-align:center;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,25,20,.12)}
.tp{padding-top:20px;gap:22px}
/* la réponse */
.reco h2{font-size:18px}
.big{flex-direction:column;align-items:flex-start;gap:2px}
.big>div{display:flex;align-items:baseline;gap:6px}
.big b{font-size:46px;letter-spacing:-.04em}
.big i{font-style:normal;color:var(--muted);font-size:15px}
.big>span{font-size:12.5px}
.verdict{align-self:flex-start;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:500;background:color-mix(in srgb,currentColor 10%,transparent);margin-top:4px}
.verdict::before{display:none}
.track{height:6px;inset:4px 0 auto 0;border-radius:3px}
.gauge{margin-top:6px}
.tick{top:0;height:14px;width:2px;border-radius:1px}
.stats{gap:0;border:1px solid var(--line);border-radius:12px}
.stats>div{padding:10px 12px}
.stats>div+div{border-left:1px solid var(--line)}
.stats dt{font-size:11.5px;white-space:nowrap}
.stats dd{font-size:16px}
.block{border-top:0;padding-top:0}
.block h2{font-size:12px;color:var(--muted);font-weight:500}
/* fiche du terrain : un signe par contrôle */
.fiche{gap:0;grid-template-columns:82px minmax(0,1fr)}
.fiche dt,.fiche dd{padding:7px 0;border-top:1px solid var(--line)}
.fiche dt:first-child,.fiche dt:first-child+dd{border-top:0;padding-top:0}
.fiche dd{gap:8px}
.fiche dd::before{width:15px;height:15px;font-size:10px;font-weight:600;line-height:15px;text-align:center;color:var(--surface);background:var(--line);transform:translateY(1px);content:""}
.fiche dd.ok::before{content:"✓"}.fiche dd.warn::before{content:"!"}.fiche dd.bad::before{content:"×"}
.btn{border-radius:10px;padding:10px 12px;transition:transform .1s,border-color .15s,opacity .15s}
.btn:active{transform:translateY(1px)}
.btn.primary:hover{opacity:.88}
.btn[disabled]{opacity:.6;cursor:default}
.exports{gap:16px}
input[type=range]{height:18px}
/* liste */
#p-list .lhead{gap:9px}
input[type=search]{background:var(--sunk);border-color:transparent;border-radius:9px;padding:8px 11px}
input[type=search]:focus{background:var(--surface);border-color:var(--line)}
select{border-radius:9px;background:var(--surface)}
.cats{font-size:13px}
.cats summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;cursor:pointer;font-weight:500;padding:3px 0;list-style:none}
.cats summary::-webkit-details-marker{display:none}
.cats summary::after{content:"+";color:var(--muted);font-weight:400}
.cats[open] summary::after{content:"–"}
.cats summary .c{margin-left:auto;font-weight:400;color:var(--muted)}
.cats #catlist{margin:6px 0 8px;max-height:42vh;overflow-y:auto}
.cats .link{margin-bottom:4px}
.cgrp{border-bottom:1px solid var(--line)}.cgrp:last-child{border-bottom:0}
.item{grid-template-columns:30px minmax(0,1fr) auto;align-items:center;padding-block:11px}
.note-score,.scp{display:inline-flex;align-items:center;justify-content:center;width:30px;height:24px;border-radius:7px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.scp.p1{background:var(--p1);color:#fff}
.scp.p2{background:color-mix(in srgb,var(--p2) 22%,transparent);color:var(--ink)}
.item .n{font-size:13.5px}
.item .a{font-size:12px}
.item .t{font-size:13.5px}
.item .s{font-size:12px}
/* méthode */
.acc:first-child{border-top:0}
#acc-hyp{margin-top:-22px}
.acc summary{font-size:13.5px}
/* carte */
.seg{border-radius:7px}
.leaflet-bar,.legend,.vue-aerienne{box-shadow:0 1px 2px rgba(15,25,20,.08),0 4px 14px rgba(15,25,20,.08);border-color:var(--line)}
.vue-aerienne{right:auto;left:calc(max(16px,env(safe-area-inset-left,0px)) + 40px);top:16px;height:32px;padding:0 12px;border-radius:9px}
.site-ic{overflow:visible}
.site-ic div.pt{width:20px;height:20px;border-radius:50%;background:var(--site);border:4px solid var(--surface);box-shadow:0 0 0 1px var(--site),0 2px 10px rgba(0,0,0,.4);cursor:grab}
.site-ic div.tag{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);white-space:nowrap;background:var(--site);color:var(--surface);font:600 11px/1 var(--f-body);padding:5px 8px;border-radius:7px;pointer-events:none}
.site-ic div.tag::after{content:"";position:absolute;left:50%;bottom:-3px;width:7px;height:7px;background:var(--site);transform:translateX(-50%) rotate(45deg)}
.autre-ic div{width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--ink);border:2px solid var(--site);font:600 11px/20px var(--f-body);text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--ombre)}
.pp .ton b{font-size:22px}
.pp select{background:var(--surface)}
/* accueil */
#decor{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.vue-page{position:relative;z-index:1;background:transparent;place-items:center start;padding-left:max(24px,9vw)}
body{background:var(--surface)}
.app{background:var(--map-bg)}
.bloc{width:min(520px,100%)}
.marque{font-weight:500;letter-spacing:.01em}
.accueil-titre{font-size:clamp(36px,5.2vw,62px);letter-spacing:-.04em;line-height:1.02;font-weight:600}
.accueil-texte{font-size:16px;line-height:1.5;max-width:44ch}
.recherche input{border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--ombre);font-size:17px}
.recherche input:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),var(--ombre)}
.suggestions{border-radius:14px;box-shadow:var(--ombre)}
.etapes{gap:14px}
.etape{font-size:15px}
.etape::before{width:10px;height:10px}
@media (max-width:900px){
 .app{height:auto;background:transparent}
 .mapbox{position:relative;inset:auto;height:56svh;min-height:340px}
 #map{position:absolute;inset:0}
 .panel{position:static;width:auto;border-radius:0;border-width:1px 0 0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface);overflow:visible}
 .leaflet-bottom.leaflet-right{right:0}
 .stats dt{white-space:normal}
 #decor{opacity:.28}
}
@media (prefers-reduced-motion:reduce){.tab,.btn{transition:none}.etape.en-cours::before{animation:none}}
.site-ic div.tag{width:auto;height:auto;border:0;box-shadow:none;display:block;cursor:default}
.site-ic div.pt{display:block}
.recherche input{background:var(--surface)}
.recherche input::-webkit-search-cancel-button{cursor:pointer}

/* ---------- Le strict nécessaire ---------- */
.etat{display:none!important}
.tp{gap:20px}
.reco{gap:3px}
.reco .choix{margin-bottom:6px}
.reco .choix:empty{display:none}
#recoadr{font-size:13px;color:var(--muted);text-decoration:none}
#recoadr:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.hero{gap:8px}
.verdict{background:none!important;padding:0!important;margin:0;font-size:13px;font-weight:500}
.fiche{display:flex;flex-direction:column;gap:7px;font-size:13px;list-style:none;margin:0;padding:0}
.fiche li{display:flex;gap:8px;align-items:baseline}
.fiche li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--line);transform:translateY(-2px)}
.fiche li.ok::before{background:var(--ok)}.fiche li.warn::before{background:var(--warn)}.fiche li.bad::before{background:var(--bad)}
.block{gap:10px}
.exports{gap:16px}
.item{grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline;padding-block:9px}
.item .n{font-weight:400;font-size:13.5px}
.item .t{font-size:13.5px;font-weight:500;color:var(--ink)}
.lhead{border-bottom:0}
.cats>.lrow{margin-top:8px}
.cats>.pick{display:flex;margin:8px 0 2px}
.cats #catlist{margin-top:4px}
.seg .c{display:none}

/* ---------- Filtres ---------- */
.lsearch{display:flex;gap:8px;align-items:stretch}
.lsearch input[type=search]{flex:1 1 auto;padding:8px 11px;border-radius:9px;background:var(--sunk);border-color:transparent}
.lsearch input[type=search]:focus{background:var(--surface);border-color:var(--line)}
.fbtn{display:inline-flex;align-items:center;gap:7px;flex:none;background:none;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.fbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.fbtn:hover,.fbtn[aria-expanded="true"]{border-color:var(--ink)}
.fnb{min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.lcount{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.fpanel{display:flex;flex-direction:column;gap:18px;padding:16px;margin:2px 0 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 10px 30px rgba(10,20,15,.08);max-height:min(62vh,560px);overflow-y:auto}
.fpanel[hidden]{display:none}
.fsec{display:flex;flex-direction:column;gap:8px}
.flab{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.factions{display:flex;gap:12px}
.factions .link{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fpanel .sw{font-size:13.5px}
.fpanel #catlist{margin:0;max-height:none;overflow:visible;border-top:1px solid var(--line)}
.fpanel .crow.g{grid-template-columns:minmax(0,1fr) auto auto;padding:9px 0}
.fpanel .crow.g input{order:3;appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.fpanel .crow.g input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.fpanel .crow.g input:checked{background:var(--ink)}
.fpanel .crow.g input:checked::after{transform:translateX(12px)}
.fpanel .crow.g input:indeterminate{background:color-mix(in srgb,var(--ink) 40%,var(--line))}
.fpanel .crow.g input:indeterminate::after{transform:translateX(6px)}
.fpanel .gname{order:1;font-weight:500}
.fpanel .gname::after{content:"›";display:inline-block;transition:transform .15s;margin-left:2px}
.fpanel .gname[aria-expanded="true"]::after{content:"›";transform:rotate(90deg)}
.fpanel .crow.g .t{order:2}
.fpanel .csub{padding:0 0 10px 2px}
.fok{width:100%;background:var(--ink);color:var(--surface);border-color:var(--ink);position:sticky;bottom:0;flex:none;box-shadow:0 -16px 14px -2px var(--surface),0 12px 0 4px var(--surface)}
.fok:hover{opacity:.9;border-color:var(--ink)}

/* ---------- À contacter en priorité ---------- */
.top3{display:flex;flex-direction:column;gap:8px}
.top3 h3{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.top3 ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.top3 li+li{border-top:1px solid var(--line)}
.t3{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 12px;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.t3:hover{background:var(--sunk)}
.t3 .r{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink)}
.t3:first-child .r{background:var(--ink);color:var(--surface)}
li:first-child .t3 .r{background:var(--ink);color:var(--surface)}
.t3 .n{min-width:0;font-weight:500}
.t3 .n b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t3 small{display:block;font-size:12px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t3 .v{text-align:right;white-space:nowrap;font-weight:500}
.top3 .note{margin:0}
.lleg{margin:0;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<canvas id="decor" aria-hidden="true" hidden></canvas>
<main class="vue-page" id="accueil" hidden>
 <div class="bloc">
  <p class="marque">MIC211MP1</p>
  <h1 class="accueil-titre">Où</h1>
  <p class="accueil-texte">Tapez le nom d’une ville.</p>
  <div class="recherche" role="combobox" aria-expanded="false" aria-haspopup="listbox">
   <input id="q" type="search" autocomplete="off" placeholder="Nom de la ville ou code postal" aria-label="Nom de la ville ou code postal" aria-autocomplete="list" aria-controls="sug">
   <div class="suggestions" id="sug" role="listbox" hidden></div>
  </div>
  <p class="erreur" id="qerr" hidden></p>
  <div class="recents" id="recents" hidden></div>
 </div>
</main>
<main class="vue-page" id="chargement" hidden>
 <div class="bloc">
  <p class="marque" id="chargevil"></p>
  <h1 class="accueil-titre" id="chargetitre">Recherche en cours</h1>
  <div class="etapes" id="etapes" aria-live="polite"></div>
  <p class="erreur" id="chargeerr" hidden></p>
  <button class="link" id="retour1">Changer de ville</button>
 </div>
</main>
<div class="app" id="app" hidden>
 <div class="mapbox">
  <div id="map" role="region" aria-label="Carte des gisements"></div>
  <button class="vue-aerienne" id="aerien" aria-pressed="false">Vue aérienne</button>
  <div class="legend" id="segs" role="group" aria-label="Afficher par priorité"></div>
 </div>
 <aside class="panel">
  <header class="head"><h1 id="ville"></h1><button class="link" id="retour">Autre ville</button></header>
  <p class="etat" id="etat" hidden></p>
  <div class="tabs" role="tablist">
   <button class="tab" role="tab" id="t-site" aria-controls="p-site" aria-selected="true">Site</button>
   <button class="tab" role="tab" id="t-list" aria-controls="p-list" aria-selected="false" tabindex="-1">Producteurs</button>
   <button class="tab" role="tab" id="t-sai" aria-controls="p-sai" aria-selected="false" tabindex="-1">Saisonnalité</button>
   <button class="tab" role="tab" id="t-met" aria-controls="p-met" aria-selected="false" tabindex="-1">Méthode</button>
  </div>
  <div class="tp" id="p-site" role="tabpanel" aria-labelledby="t-site">
   <section class="reco">
    <span class="choix" id="choix"></span>
    <h2 id="recotitre"></h2>
    <a id="recoadr" target="_blank" rel="noopener" title="Ouvrir dans Google Maps"></a>
   </section>
   <section class="hero" aria-live="polite">
    <div class="big"><div><b id="rt">–</b><i>t/an</i></div><span id="fourchette"></span></div>
    <div>
     <div class="gauge" aria-hidden="true"><div class="track"><div class="hi" id="ghi"></div><div class="lo" id="glo"></div></div><div class="tick" id="gt200"></div><div class="tick cap" id="gcap"></div></div>
     <div class="gscale" id="gscale"></div>
    </div>
    <p class="verdict" id="verdict"></p>
   </section>
   <ul class="fiche" id="fiche"></ul>
   <section class="top3" aria-labelledby="top3t"><h3 id="top3t">À contacter en priorité</h3><ol id="top3"></ol><p class="note" id="top3n"></p></section>
   <section class="block">
    <div class="range"><label for="rad">Rayon</label><input type="range" id="rad" min="1" max="5" step="0.5" value="3"><output id="radv" for="rad">3 km</output></div>
    <label class="sw">Compter les ménages<input type="checkbox" id="men" checked></label>
   </section>
   <section class="block">
    <button class="btn primary" id="best">Trouver le meilleur emplacement</button>
    <button class="btn" id="heat" aria-pressed="false">Carte de potentiel</button>
    <div class="heatleg" id="heatleg" hidden><span id="heatmin"></span><i></i><span id="heatmax"></span></div>
   </section>
   <div class="exports"><button class="link" id="xlsx2">Excel</button><button class="link" id="imprimer">Note A4</button><button class="link" id="elargir">Communes voisines</button></div>
  </div>
  <div class="tp" id="p-list" role="tabpanel" aria-labelledby="t-list" hidden>
   <div class="lhead">
    <div class="lsearch">
     <input type="search" id="fq" placeholder="Rechercher un nom ou une rue" aria-label="Rechercher un nom ou une rue">
     <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="fpanel"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>Filtres<span class="fnb" id="fnb" hidden></span></button>
    </div>
    <div class="lcount"><span id="count"></span><span id="ctot"></span></div>
    <p class="lleg">≈ taille moyenne de la catégorie, à confirmer auprès du producteur</p>
    <div class="fpanel" id="fpanel" role="region" aria-label="Filtres" hidden>
     <div class="fsec"><div class="flab">Trier par</div>
      <div class="chips" data-for="sort"><button data-v="t">Tonnage</button><button data-v="prio">Priorité</button><button data-v="d">Distance</button><button data-v="n">Nom</button></div>

<script>/* Moteur de l'outil : collecte des producteurs, tonnages, score, recherche et contrôle d'un site.
   Tourne dans le navigateur (et dans node pour les tests) : aucune dépendance, aucun serveur.
   Un producteur n'existe que s'il est dans OpenStreetMap ou SIRENE ; rien n'est inventé. */
(function (racine) {
  'use strict';
  const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
  const TRANCHES = {'00': 0, '01': 1.5, '02': 4, '03': 7.5, '11': 15, '12': 35, '21': 75, '22': 150, '31': 225, '32': 375, '41': 750, '42': 1500, '51': 3500, '52': 7500, '53': 10000};
  const ARRONDISSEMENTS = {'75056': [75101, 20], '69123': [69381, 9], '13055': [13201, 16]};
  const REGULARITE = {annee: 1, menages: 1, hebdo: 1, scolaire: 0.8, irreg: 0.6};
  const RESTAURATION = {C03: ['P13', 'couverts'], C05: ['P13', 'couverts'], C07: ['P13', 'couverts'], C04: ['P14', 'tickets']};
  // Catégories où une unité peut s'installer sur le site même du producteur (Holtzwihr chez un maraîcher, marché de gros de Strasbourg)
  const SITES_PRODUCTEUR = new Set(['C09', 'C12', 'C14', 'C17', 'C29', 'C32', 'C37', 'C38', 'C39', 'C40', 'C41', 'C42', 'C43', 'C44', 'C45', 'C46', 'C47', 'C48']);
  const GROS_ETABLISSEMENTS = new Set(['C08', 'C09', 'C12', 'C14', 'C15', 'C16', 'C17']);
  const TYPES_TERRAIN = {producteur: 'Sur le site d\'un gros producteur', zone: 'Zone d\'activité', friche: 'Friche', parking: 'Parking', agricole: 'Terrain agricole'};

  const pause = ms => new Promise(ok => setTimeout(ok, ms));
  const arrondi = (x, n = 1) => { const k = 10 ** n; return Math.round(x * k) / k; };

  // ---------------------------------------------------------------- réseau
  // Instantané du Luxembourg : un script par commune, lisible aussi quand la page est ouverte directement depuis le disque
  const instantanes = new Map();
  function chargerInstantane(id) {
    if (typeof document === 'undefined') return Promise.resolve(null);
    if (!instantanes.has(id)) instantanes.set(id, new Promise(ok => {
      const s = document.createElement('script');
      const fin = d => { s.remove(); ok(d); };
      (window.__attentesLU ||= {})[id] = fin;
      window.__instantaneLU ||= (cle, d) => window.__attentesLU[cle]?.(d);
      s.onerror = () => fin(null);
      s.src = `lu/${id}.js`;
      document.head.appendChild(s);
    }));
    return instantanes.get(id);
  }
  async function instantanesDuRayon(la, lo, r) {
    const index = await chargerInstantane('index');
    if (!index) return null;
    const k = Math.cos(la * Math.PI / 180);
    const proches = index.filter(([, x0, y0, x1, y1]) => Math.hypot((Math.max(x0 - lo, 0, lo - x1)) * 111.32 * k, (Math.max(y0 - la, 0, la - y1)) * 110.57) <= r);
    const docs = await parallele(proches, 6, ([id]) => chargerInstantane(id));
    return docs.every(Boolean) ? docs : null;
  }
  function fusionnerInstantanes(docs, la, lo, r) {
    const proche = p => km(la, lo, p.lat, p.lon) <= r;
    const vus = new Set(), elements = [], fond = [];
    for (const d of docs) for (const e of d.elements) {
      const cle = e.type + e.id;
      if (!vus.has(cle) && proche(e.center || e)) { vus.add(cle); elements.push(e); }
    }
    for (const d of docs) for (const e of d.fond.slice(1)) { // le contour de chaque commune n'a pas de sens dans une étude par rayon
      const pts = e.center ? [e.center] : e.geometry || (e.members ? e.members.flatMap(m => m.geometry) : [e]);
      const cle = e.type + pts[0].lat + ',' + pts[0].lon + ',' + pts.length + (e.tags?.name || '');
      if (!vus.has(cle) && pts.some(proche)) { vus.add(cle); fond.push(e); }
    }
    return {date: docs[0].date, elements, fond};
  }

  async function requete(url, {corps, delai = 30000} = {}) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), delai);
    try {
      const options = corps ? {method: 'POST', body: corps, headers: {'Content-Type': 'application/x-www-form-urlencoded'}, signal: ctl.signal} : {signal: ctl.signal};
      const r = await fetch(url, {...options, cache: url.includes('geopf.fr') || url.includes('apicarto') ? 'no-store' : 'default'});
      if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.statut = r.status; throw e; }
      return await r.json();
    } finally { clearTimeout(t); }
  }
  async function http(url, {essais = 3, delai = 30000} = {}) {
    let erreur;
    for (let i = 0; i < essais; i++) {
      try { return await requete(url, {delai}); } catch (e) {
        erreur = e;
        if (e.statut === 404 || (e.statut === 400 && !url.includes('geopf.fr'))) throw e; // l'IGN renvoie parfois 400 sous forte charge
        await pause(e.statut === 429 ? 1500 * (i + 1) : 500 * (i + 1));
      }
    }
    throw erreur;
  }
  async function overpass(q, signaler, delai = 100000) {
    // Les serveurs publics saturent souvent : on en interroge plusieurs à quelques secondes d'écart, le premier qui répond gagne
    const corps = 'data=' + encodeURIComponent(q);
    for (let tour = 0; tour < 2; tour++) {
      const ctl = [];
      let gagne = false;
      try {
        return await Promise.any(OVERPASS.map(async (url, i) => {
          await pause(i * 6000);
          if (gagne) throw new Error('inutile');
          const c = new AbortController(), t = setTimeout(() => c.abort(), delai); ctl.push(c);
          try {
            const r = await fetch(url, {method: 'POST', body: corps, headers: {'Content-Type': 'application/x-www-form-urlencoded'}, signal: c.signal});
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const j = await r.json();
            if (!j.elements) throw new Error('réponse incomplète');
            gagne = true;
            return j;
          } finally { clearTimeout(t); }
        }));
      } catch (e) {
        if (signaler) signaler('OpenStreetMap est chargé, nouvel essai');
        await pause(5000 * (tour + 1));
      } finally { gagne = true; ctl.forEach(c => c.abort()); }
    }
    const e = new Error('OpenStreetMap indisponible'); e.osm = true; throw e;
  }
  async function parallele(liste, n, tache, progres) {
    const res = new Array(liste.length); let i = 0, fini = 0;

    // Tailles publiées connues (Luxembourg : élèves par lycée, lits des maisons de soins), lues dans references/tailles_connues.csv
    const sansAccent = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const motifs = (refs.tailles || []).filter(t => t.pays === cible.pays).map(t => ({...t, m: sansAccent(t.motif).replace(/^(lycee technique|lycee prive|lycee|ecole internationale|ecole privee)\s+(de |d'|du |des |pour )?/, '')}));
    for (const it of items) {
      if (it._taille != null) continue;
      const n = sansAccent(it.name);
      const t = motifs.find(t => (t.type === 'lycée' ? ['C10', 'C11', 'C12'] : ['C14', 'C15', 'C16']).includes(it.categorie_id) && (n.includes(t.m) || new RegExp(`\\b${t.sigle.toLowerCase()}\\b`).test(n) && t.sigle.length > 2));
      if (!t) continue;
      if (/annexe/.test(n)) { it.notes.push(`${t.nom} : ${t.taille} ${t.unite} tous sites confondus (${t.source}) ; la part de cette annexe est inconnue`); continue; }
      const repas = t.unite === 'lits' ? Math.round(+t.taille * P.P06 * 365) : Math.round(+t.taille * P.P08 * P.P07);
      it._taille = repas;
      it._txt = t.unite === 'lits' ? `${t.taille} lits × ${P.P06} repas × 365 jours (${t.source}, ${t.annee})` : `${t.taille} élèves × ${Math.round(P.P08 * 100)} % à la cantine × ${P.P07} jours (${t.source})`;
      if (t.remarque) it.notes.push(t.remarque);
    }
    // Un établissement de santé du registre resté sans taille réelle, à côté d'un établissement FINESS, est le même lieu sous un autre nom
    for (const i of items) if (sante.has(i.categorie_id) && !lies.has(i.id) && [...lies].length && autour(i.lat, i.lon).some(j => lies.has(j.id) && j !== i && km(i.lat, i.lon, j.lat, j.lon) < 0.15)) {
      i._doublon = true; i.notes.push('Probablement compté dans un établissement voisin du fichier FINESS : non compté pour ne pas le compter deux fois');
    }
    // Collectivité : ménages et espaces verts
    const zoneDiffuse = (id, name, l, note) => ({id, name, categorie_id: id.startsWith('coll') ? 'C01' : 'C02', lat: l.lat, lon: l.lon, addr: '', maj: '', phone: null, web: null, source: l.src, _tags: {}, _zone: true, notes: [note], siret: null, effectif: null, _taille: l.pop, _txt: `${l.pop} habitants (${l.src})`});
    for (const l of ctx.locs) items.push(zoneDiffuse(`coll/${l.nom}`, `Ménages de ${l.nom}`, l, 'Gisement diffus : part des habitants du secteur'));
    for (const l of ctx.verts) items.push(zoneDiffuse(`verts/${l.nom}`, `Espaces verts communaux de ${l.nom}`, l, 'Tontes et feuilles du service espaces verts, estimées à partir de la population'));
    // Tonnages et score
    const annee = new Date().getFullYear();
    for (const it of items) {
      const c = parId[it.categorie_id], h = hyps[c.id_hypothese];
      let taille = it._taille ?? null, txt = it._txt || null, fiab = taille != null ? 'base' : 'ratio';
      // Pas d'estimation quand on ne sait pas qui contacter ni quelle taille retenir : mieux vaut « à demander » qu'un chiffre inventé
      const sansNom = it.name.endsWith('(sans nom)'), esat = it.categorie_id === 'C16' && /\bE\.?S\.?A\.?T\b|aide par le travail/i.test(it.name);
      const nonEstime = sansNom || it._doublon || esat;
      if (sansNom) it.notes.push('Lieu sans nom dans OpenStreetMap : à identifier sur place avant de compter son gisement');
      if (esat) it.notes.push('ESAT : établissement de travail sans hébergement, le nombre de repas est à demander');
      if (nonEstime) { taille = null; txt = 'Taille inconnue'; }
      else if (taille == null) { const r = tailleReelle(it.categorie_id, it._tags, it.effectif, P, it); if (r[0] != null) { [taille, txt, fiab] = r; } }
      if (taille == null && !nonEstime && h.unite_indicateur === 'salariés' && it.effectif && etp(it.effectif)) { taille = etp(it.effectif); txt = `${taille} salariés (tranche d'effectif SIRENE)`; fiab = 'effectif'; }
      if (taille == null && !nonEstime) { taille = parseFloat(h.taille_par_defaut); if (!isFinite(taille)) taille = null; txt = `Taille moyenne de la catégorie : ${h.justification_taille_par_defaut}`; }
      const [tmin, tmid, tmax] = tonnage(h, taille);
      const inconnu = !h.ratio_central_kg || nonEstime;
      if (!h.ratio_central_kg) it.notes.push('Pas de ratio fiable : tonnage à demander au producteur');
      const ratio = inconnu ? 'à collecter' : `${h.ratio_central_kg} ${h.unite_ratio}`;
      if (it.maj && parseInt(it.maj) <= annee - 5) it.notes.push(`Fiche OSM non mise à jour depuis ${it.maj.slice(0, 4)} : vérifier que l'établissement existe encore`);
      if (taille != null && !inconnu) it.notes.push(`Base du calcul : ${txt} × ${ratio}`);
      const p = c.profil_saisonnier;
      Object.assign(it, {tmin, tmid, tmax, taille, taille_txt: txt, fiab, id_hypothese: c.id_hypothese, ratio, cat: c.categorie, nace: c.codes_NACE, waste: c.biodechets_resume, types_biodechets: c.types_biodechets,
        compat: c.compatibilite, seg: c.segment_carte, flux: profils[p].description, prof: p, key: it.categorie_id === 'C01' ? 'collectivite' : it.categorie_id, inc: inconnu && c.segment_carte !== 'exclu' ? 1 : 0, groupe: c.groupe,
        site_possible: SITES_PRODUCTEUR.has(it.categorie_id) ? 1 : 0});
      it.status = /^(coll|verts)\//.test(it.id) || it._zone ? 'zone' : (it.source === 'SIRENE' || it._adresseOk) ? 'registre' : 'attente';
      it.dist = null; it.pays = cible.pays;
      it.name = lisible(it.name); it.addr = lisible(it.addr);
      if (it.categorie_id === 'C01') it.pop = Math.round(taille);
      calculerScore(it, P);
    }
    return items;
  }

  // ---------------------------------------------------------------- analyse complète d'une commune
  /* Résultat : {meta, items, base, plus tard : osmTard (promesse) si OpenStreetMap répond après l'affichage de la carte}. */
  async function analyser(cible, REF, signaler = () => {}, options = {}) {
    const refs = charger(REF), debut = Date.now(), grace = options.grace ?? 4000;
    const rayon = options.rayon || null;
    signaler('commune', 'en-cours');
    let infoFR = null, contour = [], centre, popCommune = 0, sourcePop = 'INSEE', instantane = null;
    if (cible.pays === 'FR') {
      infoFR = await http(`https://geo.api.gouv.fr/communes/${cible.code}?fields=code,nom,population,centre,contour`);
      contour = anneauxContour(infoFR.contour);
      centre = [infoFR.centre.coordinates[1], infoFR.centre.coordinates[0]];
      popCommune = infoFR.population || 0;
    } else {
      // Luxembourg : instantané livré avec le site quand il est disponible (les serveurs publics saturent souvent)
      instantane = await chargerInstantane(cible.osm);
      let rel;
      if (instantane) { centre = instantane.centre; rel = {tags: {population: instantane.population || ''}}; }
      else {
        const r = await overpass(`[out:json][timeout:60];rel(${cible.osm});out tags center;`, m => signaler('commune', 'en-cours', m));
        rel = r.elements[0];
        centre = [rel.center.lat, rel.center.lon];
      }
      if (instantane?.popWikidata) { popCommune = instantane.popWikidata; sourcePop = 'Wikidata'; }
      else if (cible.wikidata) { const w = await populationsWikidata([cible.wikidata]).catch(() => ({})); if (w[cible.wikidata]) { popCommune = w[cible.wikidata][0]; sourcePop = `Wikidata (${w[cible.wikidata][1]})`; } }
      if (!popCommune && popTag(rel.tags || {})) { popCommune = popTag(rel.tags); sourcePop = 'OpenStreetMap'; }
    }
    const voisins = rayon && instantane ? await instantanesDuRayon(centre[0], centre[1], rayon) : null;
    if (voisins) instantane = fusionnerInstantanes(voisins, centre[0], centre[1], rayon);
    const communes = rayon ? await communesDuRayon(cible.pays, centre[0], centre[1], rayon, m => signaler('commune', 'en-cours', m), voisins) : [];
    signaler('commune', 'fait', rayon ? `${communes.length} communes dans le rayon` : `${popCommune.toLocaleString('fr-FR')} habitants`);

    const zn = zoneOverpass(cible, rayon, centre);
    const meta = {ville: infoFR?.nom || cible.nom, pays: cible.pays, code: cible.code || null, osm: cible.osm || null, date: new Date().toISOString().slice(0, 10), rayon, centre, population: popCommune, sourcePop, osmComplet: false, sireneComplet: cible.pays !== 'FR', ignComplet: cible.pays !== 'FR', communes: communes.map(c => ({nom: c.nom, code: c.code, population: c.population, part: c.part}))};
    const ctx = {cible, elements: [], officiels: [], etabs: [], centre, meta, locs: [], verts: []};
    let fond = {boundary: contour, major: [], minor: [], acces: [], rail: [], industrial: [], wood: [], terrains: [], residentiel: [], logements: [], localites: []};
    fond.ring = contour.length ? contour.reduce((m, r) => r.length > m.length ? r : m, contour[0]) : [];

    // Trois familles de sources en parallèle ; OpenStreetMap ne retarde jamais la carte en France
    const codes = rayon ? communes.map(c => c.code).filter(Boolean) : [cible.code];
    let boiteZone;
    if (cible.pays === 'FR') {
      if (rayon) { const k = Math.cos(centre[0] * Math.PI / 180), dx = rayon / 111.32 / k, dy = rayon / 110.57; boiteZone = [centre[1] - dx, centre[0] - dy, centre[1] + dx, centre[0] + dy]; }
      else boiteZone = boite(contour.flat());
    }
    const dansZoneEtude = (la, lo) => rayon ? km(centre[0], centre[1], la, lo) <= rayon : contour.some(r => dansAnneau(lo, la, r));
    const taches = [];
    if (cible.pays === 'FR') {
      signaler('ign', 'en-cours'); signaler('sirene', 'en-cours');
      taches.push(collecterIGN(boiteZone, codes, m => signaler('ign', 'en-cours', m)).then(r => {
        fond = {...fond, ...r.fond}; ctx.officiels.push(...r.lieux.filter(l => dansZoneEtude(l.la, l.lo))); meta.ignComplet = true;
        signaler('ign', 'fait', `${fond.terrains.length} terrains, ${fond.logements.length} habitations`);
      }).catch(() => signaler('ign', 'alerte', 'indisponible')));
      taches.push(collecterEcoles(codes).then(l => { ctx.officiels.push(...l); }).catch(() => {}));
      // Taille réelle des hôpitaux, EHPAD et établissements pour personnes handicapées (FINESS et SAE), servie avec le site
      taches.push(Promise.all([...new Set(codes.map(c => c.startsWith('97') ? c.slice(0, 3) : c.slice(0, 2)))].map(d => fetch(`fr/finess/${d}.json`).then(r => r.ok ? r.json() : []).catch(() => [])))
        .then(l => { const set = new Set(codes); ctx.finess = l.flat().filter(f => set.has(f[9])); }));
      taches.push(collecterSirene(codes, refs, (m, f) => signaler('sirene', 'en-cours', m, f)).then(r => {
        ctx.etabs = r.etabs; meta.sireneComplet = true; meta.nonDiffusibles = r.nonDiffusibles;
        signaler('sirene', 'fait', `${r.etabs.length} établissements`);
      }).catch(() => signaler('sirene', 'alerte', 'indisponible')));
    }
    signaler('osm', 'en-cours');
    const fondOSM = (el) => {
      if (cible.pays === 'LU') {
        const f = construireFond(el, contour);
        fond = {...f, ring: f.ring};
      } else {
        const f = construireFond(el, contour);
        fond.terrains.push(...f.terrains.filter(t => t.type === 'friche'));
        fond.residentiel.push(...f.residentiel);
        fond.logements.push(...f.logements);
      }
      fond.localites = f_localites(el);
    };
    const f_localites = el => el.filter(e => e.type === 'node' && e.tags?.place);
    const osmP = (async () => {
      if (instantane && !options.frais) return {e: instantane.elements, f: instantane.fond};
      try {
        const frais = Promise.all([collecterOSM(cible, zn, refs, m => signaler('osm', 'en-cours', m)), collecterFond(cible, zn, m => signaler('osm', 'en-cours', m))]);
        // Une actualisation ne doit pas faire attendre : passé une minute, on reste sur l'instantané
        const [e, f] = await (instantane ? Promise.race([frais, pause(60000).then(() => { throw new Error('délai'); })]) : frais);
        return {e, f};
      } catch (err) {
        if (instantane) return {e: instantane.elements, f: instantane.fond}; // actualisation impossible : on garde l'instantané
        throw err;
      }
    })();
    let osmFini = false;
    const appliquerOSM = ({e, f}) => { ctx.elements = e; fondOSM(f); meta.osmComplet = true; osmFini = true; if (instantane && e === instantane.elements) meta.instantane = instantane.date; };
    await Promise.all(taches);
    if (cible.pays === 'FR' && !meta.sireneComplet && !meta.ignComplet) { /* on tente quand même OpenStreetMap ci-dessous */ }
    if (cible.pays === 'FR' && (meta.sireneComplet || meta.ignComplet)) {
      await Promise.race([osmP.then(appliquerOSM).catch(() => { osmFini = true; }), pause(grace)]);
    } else {
      try { appliquerOSM(await osmP); } catch (e) { if (cible.pays === 'LU') throw new Error('OpenStreetMap ne répond pas pour le moment : il est indispensable au Luxembourg. Réessayez dans quelques minutes.'); throw new Error('Les sources de données ne répondent pas pour le moment. Réessayez dans quelques minutes.'); }
    }
    signaler('osm', meta.osmComplet ? 'fait' : 'alerte', meta.osmComplet ? `${ctx.elements.length} lieux` : 'en attente, sera ajouté dès qu\'il répond');

    signaler('calcul', 'en-cours');
    // Population : localités au Luxembourg, un seul point en France
    if (rayon) {
      for (const c of communes) {
        if (!c.population) continue;
        const l = {nom: c.nom, lat: c.centre[0], lon: c.centre[1], pop: Math.round(c.population * c.part), src: `${c.source} : ${c.population} hab., dont ${Math.round(c.part * 100)} % de la surface dans le rayon`};
        ctx.locs.push(l); ctx.verts.push(l);
      }
      meta.population = ctx.locs.reduce((x, l) => x + l.pop, 0); meta.sourcePop = 'communes du rayon, au prorata de la surface';
    } else {
      const v = {nom: meta.ville, lat: centre[0], lon: centre[1], pop: popCommune, src: sourcePop};
      ctx.verts.push(v);
      const limites = contour.length ? contour : fond.boundary || []; // au Luxembourg, le contour vient d'OpenStreetMap
      const dedans = (fond.logements || []).filter(([x, y]) => limites.some(r => dansAnneau(x, y, r)));
      if (dedans.length >= 30) ctx.locs = secteursMenages(dedans, meta.ville, popCommune, sourcePop, Math.cos(centre[0] * Math.PI / 180));
      else if (cible.pays === 'LU' && fond.localites?.length) {
        const ids = fond.localites.map(l => l.tags.wikidata).filter(Boolean);
        const wd = ids.length ? await populationsWikidata(ids).catch(() => ({})) : {};
        for (const l of fond.localites) { const p = popTag(l.tags) || (wd[l.tags.wikidata] || [])[0]; if (p) ctx.locs.push({nom: l.tags.name, lat: l.lat, lon: l.lon, pop: p, src: popTag(l.tags) ? 'OpenStreetMap' : 'Wikidata'}); }
        const somme = ctx.locs.reduce((x, l) => x + l.pop, 0);
        if (ctx.locs.length && Math.abs(somme - popCommune) > 0.15 * Math.max(popCommune, 1)) ctx.locs = [];
        else if (ctx.locs.length && somme !== popCommune) { const k = popCommune / somme; ctx.locs.forEach(l => { l.pop = Math.round(l.pop * k); l.src += `, ramené au total communal (${sourcePop})`; }); }
      }
      if (!ctx.locs.length) ctx.locs = [v];
    }
    const items = assembler(ctx, refs);
    meta.dureeCollecte = Math.round((Date.now() - debut) / 100) / 10;
    signaler('calcul', 'fait');
    const res = {meta, items, base: fond};
    if (!osmFini) {
      // OpenStreetMap arrive après coup : mêmes étapes, résultat complet qui remplace le premier
      res.osmTard = osmP.then(({e, f}) => {
        appliquerOSM({e, f});
        return {meta, items: assembler(ctx, refs), base: fond};
      }).catch(() => null);
    }
    return res;
  }

  // Les habitants de la commune sont répartis par secteurs d'un kilomètre, au prorata des logements :
  // un seul point au centre-ville ferait entrer ou sortir toute la population du rayon d'un coup
  function secteursMenages(logements, nom, pop, src, k) {
    const cases = new Map();
    for (const [x, y, n = 1] of logements) {
      const cle = Math.round(x * 111.32 * k) + ',' + Math.round(y * 110.57);
      const c = cases.get(cle) || {n: 0, x: 0, y: 0};
      c.n += n; c.x += x * n; c.y += y * n;
      cases.set(cle, c);
    }
    const total = [...cases.values()].reduce((a, c) => a + c.n, 0);
    const gardees = [...cases.values()].filter(c => c.n >= total * 0.005).sort((a, b) => b.n - a.n);
    const somme = gardees.reduce((a, c) => a + c.n, 0);
    const out = gardees.map((c, i) => ({nom: `${nom}, secteur ${i + 1}`, lat: c.y / c.n, lon: c.x / c.n, pop: Math.round(pop * c.n / somme), src: `${src}, répartie selon les logements`}));
    if (out.length) out[0].pop += pop - out.reduce((a, l) => a + l.pop, 0);
    return out;
  }

  // ---------------------------------------------------------------- contrôle des adresses (en tâche de fond)
  const premierNombre = s => { const m = /^\s*(\d+)/.exec(s || ''); return m ? m[1] : null; };
  const formatAdresse = (pays, o) => pays === 'LU' ? `${o.numero || ''}, ${o.rue}, L-${o.cp} ${o.localite}`.replace(/^[ ,]+/, '') : `${o.numero || ''} ${o.rue}, ${o.cp} ${o.localite}`.trim();
  // Deux portes vers la Base Adresse Nationale : si l'une sature, l'autre répond
  const adresseFR = (type, q) => http(`https://api-adresse.data.gouv.fr/${type}/?${q}`, {essais: 2}).catch(() => http(`https://data.geopf.fr/geocodage/${type}?${q}`, {essais: 2}));
  async function adresseOfficielle(pays, lat, lon) {
    if (pays === 'LU') {
      const r = await http(`https://apiv3.geoportail.lu/geocode/reverse?lon=${lon}&lat=${lat}`, {essais: 2});
      const a = (r.results || [])[0];
      return a ? {numero: a.number, rue: a.street, cp: a.postal_code, localite: a.locality, distance: a.distance} : null;
    }
    const r = await adresseFR('reverse', `lon=${lon}&lat=${lat}`);
    const f = (r.features || [])[0];
    return f ? {numero: f.properties.housenumber, rue: f.properties.street || f.properties.name, cp: f.properties.postcode, localite: f.properties.city, distance: f.properties.distance} : null;
  }
  async function chercherAdresse(pays, texte, lat, lon) {
    if (pays === 'LU') {
      const r = await http('https://apiv3.geoportail.lu/geocode/search?' + new URLSearchParams({queryString: texte}), {essais: 2});
      for (const a of r.results || []) if ((a.accuracy || 0) >= 8 && a.AddressDetails) { const d = a.AddressDetails, [lo, la] = a.geomlonlat.coordinates; return {numero: d.postnumber, rue: d.street, cp: d.zip, localite: d.locality, lat: la, lon: lo}; }
      return null;
    }
    const r = await adresseFR('search', new URLSearchParams({q: texte, lat, lon, limit: 1}));
    for (const f of r.features || []) { const p = f.properties, [lo, la] = f.geometry.coordinates; if (p.type === 'housenumber' && (p.score || 0) >= 0.7) return {numero: p.housenumber, rue: p.street, cp: p.postcode, localite: p.city, lat: la, lon: lo}; }
    return null;
  }
  async function verifierUneAdresse(it, ville) {
    const pays = it.pays, tags = it._tags || {}, rue = tags['addr:street'], num = tags['addr:housenumber'], proche = it.id.startsWith('node') ? 100 : 150;
    if (rue && num) {
      const o = await chercherAdresse(pays, `${num} ${rue} ${tags['addr:city'] || ville}`, it.lat, it.lon);
      if (o && premierNombre(o.numero) === premierNombre(num)) {
        const d = Math.round(km(it.lat, it.lon, o.lat, o.lon) * 1000);
        if (d <= proche) { it.addr = formatAdresse(pays, o); return ['confirmee', null, d]; }
        return ['conflit', `Adresse OSM « ${num} ${rue} » trouvée au registre mais à ${d} m du point`, d];
      }
    }
    const off = await adresseOfficielle(pays, it.lat, it.lon);
    if (!off || off.distance == null) return ['a_verifier', 'Aucune adresse officielle trouvée à proximité', null];
    const d = Math.round(off.distance);
    if (d > (it.id.startsWith('node') ? 25 : 70)) return ['a_verifier', `Adresse officielle la plus proche à ${d} m : ${formatAdresse(pays, off)}`, d];
    it.addr = formatAdresse(pays, off);
    if (rue && num) return ['conflit', `Adresse OSM « ${num} ${rue} » absente du registre ; adresse officielle la plus proche : ${it.addr}`, d];
    return ['deduite', null, d];
  }
  async function verifierAdresses(items, ville, P, progres) {
    const liste = items.filter(i => i.status === 'attente');
    let echecs = 0;
    await parallele(liste, 6, async it => {
      try {
        const [st, note, d] = await verifierUneAdresse(it, ville);
        it.status = st; it.dist = d; if (note) it.notes.push(note);
        calculerScore(it, P);
      } catch (e) { echecs++; it.status = 'a_verifier'; it.notes.push('Contrôle d\'adresse impossible pour le moment'); }
    }, progres);
    return {total: liste.length, echecs};
  }

  // ---------------------------------------------------------------- recherche du site
  // Une grande usine n'est pas un terrain d'accueil : elle ne se propose que si l'exploitant lui-même est démarché
  const SITE_PRIVATIF = /^(site|usine)\b|arcelor|aci[ée]rie|raffinerie|centrale\b|carri[èe]re/i;
  function preparerSites(base, items, P, centreContrainte) {
    const riv = base.residentiel.map(p => ({p, b: boite(p)}));
    const k = Math.cos((base.ring[0]?.[1] ?? centreContrainte?.[0] ?? 46) * Math.PI / 180);
    const pasD = Math.max(P.P18, 60) / 1000;
    const pasG = {x: pasD / 111.32 / k, y: pasD / 110.57};
    const logements = grille(base.logements, pasG);
    const logementsLarges = grille(base.logements, {x: 0.25 / 111.32 / k, y: 0.25 / 110.57});
    const sample = [];
    for (const g of base.acces) for (let i = 1; i < g.length; i++) {

  }
  /* Classe les emplacements : tonnage capté (plafonné à la capacité) × préférence du type de terrain × proximité des producteurs

  function classerSites(cand, items, r, compte, P) {
    const coef = {producteur: P.P21, zone: P.P22, friche: P.P23, parking: P.P23, agricole: P.P24};
    const pts = items.filter(compte).map(o => [o.lat, o.lon, o.mid ?? o.tmid]);
    const k = Math.cos((pts[0]?.[0] ?? 46) * Math.PI / 180) * 111.32;

  // Plusieurs unités si le gisement restant dépasse encore le seuil de rentabilité
  function planDeSites(cand, items, r, compte, P, maxSites = 3) {

      const classes = classerSites(libres, items, r, reste, P);

  // ---------------------------------------------------------------- fiche d'un terrain
  async function ficheSite(lat, lon, pays, P, base) {
    const f = {adresse: null, parcelle: null, plu: null, habitation: null, inondation: null, rejet: null};
    const essai = async fn => { try { return await fn(); } catch (e) { return undefined; } };
    const a = await essai(() => adresseOfficielle(pays, lat, lon));

      const [cad, gpu, azi, bat] = await Promise.all([
        essai(() => http(`https://apicarto.ign.fr/api/cadastre/parcelle?geom=${point}`, {essais: 2, delai: 15000})),
        essai(() => http(`https://apicarto.ign.fr/api/gpu/zone-urba?geom=${point}`, {essais: 2, delai: 15000})),
        essai(() => http(`https://www.georisques.gouv.fr/api/v1/gaspar/azi?latlon=${lon.toFixed(6)},${lat.toFixed(6)}&rayon=100`, {essais: 2, delai: 15000})),
        essai(() => http('https://data.geopf.fr/wfs/ows?' + new URLSearchParams({SERVICE: 'WFS', VERSION: '2.0.0', REQUEST: 'GetFeature', TYPENAMES: 'BDTOPO_V3:batiment', COUNT: '200', OUTPUTFORMAT: 'application/json', SRSNAME: 'EPSG:4326',
          CQL_FILTER: `DWITHIN(geometrie,POINT(${lat.toFixed(6)} ${lon.toFixed(6)}),300,meters) AND (usage_1='Résidentiel' OR usage_2='Résidentiel')`}), {essais: 2, delai: 15000})),
      ]);

      if (pc) f.parcelle = {section: pc.section, numero: pc.numero, surface: pc.contenance, idu: pc.idu};
      const z = gpu?.features?.[0]?.properties;

        (bat.features || []).forEach(b => visiter(b.geometry.coordinates));

      let m = Infinity;
      for (const [x, y] of base.logements) { const d = km(lat, lon, y, x) * 1000; if (d < m) m = d; }
      f.habitation = {distance: isFinite(m) ? Math.round(m) : null, source: 'OpenStreetMap', auDela: !isFinite(m)};

  }

<script>/* Interface : accueil, chargement, carte et panneau. REF et COMMUNES_LU sont injectés à la construction de la page. */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const fmt = x => (Math.round(x * 10) / 10).toLocaleString('fr-FR');
  const fmt0 = x => Math.round(x).toLocaleString('fr-FR');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const lire = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

  // ---------------------------------------------------------------- mémoire locale des analyses (7 jours)
  const SEPT_JOURS = 7 * 864e5;
  const base = () => new Promise((ok, ko) => {
    const r = indexedDB.open('outil-gisements', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('analyses');
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
  async function memoLire(cle) {
    try {
      const b = await base();
      return await new Promise(ok => { const q = b.transaction('analyses').objectStore('analyses').get(cle); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); });
    } catch { return null; }
  }
  async function memoEcrire(cle, v) {
    try { const b = await base(); b.transaction('analyses', 'readwrite').objectStore('analyses').put({...v, _quand: Date.now()}, cle); } catch { /* sans mémoire, l'analyse sera simplement refaite */ }
  }

  // ---------------------------------------------------------------- décor : des producteurs qui apparaissent autour d'un site
  function creerDecor() {
    const c = $('decor'), ctx = c.getContext('2d');
    c.hidden = false;
    let graine = 7; const hasard = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
    const normal = () => Math.sqrt(-2 * Math.log(hasard() || .01)) * Math.cos(2 * Math.PI * hasard());

    }

  }

  // ---------------------------------------------------------------- navigation

  const adresse = (c, rayon) => `${location.pathname}?ville=${encodeURIComponent(c.pays === 'FR' ? 'FR:' + c.code : 'LU:' + c.osm)}${c.nom ? '&nom=' + encodeURIComponent(c.nom) : ''}${rayon ? '&rayon=' + rayon : ''}`;

    };

      const res = await Moteur.analyser(cible, REF, (e, s, m) => { if (etat[e]) { etat[e].s = s; etat[e].m = m || ''; peindre(); } }, {rayon, frais});

    const COLLECTE = o => o.categorie_id === 'C01' || o.categorie_id === 'C02';
    const CATS_COLLECTE = () => [...new Set(DATA.filter(COLLECTE).map(o => o.cat))];

    let ALL_CATS, CAT_SEG;
    const indexer = () => { ALL_CATS = [...new Set(DATA.map(o => o.cat))]; CAT_SEG = Object.fromEntries(DATA.map(o => [o.cat, o.seg])); };
    indexer();
    const catsParDefaut = () => new Set(ALL_CATS.filter(c => CAT_SEG[c] !== 'exclu'));
    const state = {cats: catsParDefaut(), prio: new Set([1, 2, 3]), q: '', month: null, heat: false, open: new Set(), plan: [], siteIndex: 0, exclus: new Set(), cand: null, manuel: false, fiche: null, ficheDe: null, type: null, aerien: false};
    const appliquerRatios = () => DATA.forEach(o => { if (o.pop) { o.tmin = Math.round(o.pop * H.kmin / 1000); o.tmax = Math.round(o.pop * H.kmax / 1000); o.tmid = Math.round(o.pop * Math.max(H.kmin, Math.min(H.kmax, parseFloat(h01.ratio_central_kg))) / 1000); } o.mid = o.tmid; o.w = CAL[o.prof].w; o.wsum = o.w.reduce((a, b) => a + b, 0); });
    appliquerRatios();
    const site = {lat: meta.centre[0], lon: meta.centre[1], r: Math.min(meta.rayon || 3, 5)};
    const kmTo = Moteur.km;
    const coefD = o => o.d <= site.r ? 1 - 0.4 * o.d / site.r : 0.4;
    const scoreDe = o => o.sb ? Math.round(o.sb * coefD(o)) : 0;
    const prioDe = o => !o.sb ? 0 : o.sc >= P.P16 ? 1 : o.sc >= P.P17 ? 2 : 3;
    const compte = o => state.cats.has(o.cat) && !state.exclus.has(o.id);
    const montre = o => state.cats.has(o.cat) && (state.month == null || o.w[state.month] > 0) && (o.key === 'collectivite' || !o.sb || state.prio.has(prioDe(o)));
    const douteuse = o => o.status === 'conflit' || o.status === 'a_verifier';
    const cote = () => DATA.forEach(o => { o.d = kmTo(site.lat, site.lon, o.lat, o.lon); o.sc = scoreDe(o); });

    // ---- carte
    $('ville').textContent = meta.ville + (meta.rayon ? ` et ${meta.rayon} km autour` : '');
    const map = L.map('map', {preferCanvas: true, zoomSnap: 0.25});
    map.attributionControl.setPrefix(false).addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' + (meta.pays === 'FR' ? ' · IGN · Base Adresse Nationale' : ' · geoportail.lu'));
    map.createPane('heat').style.zIndex = 410;
    map.createPane('pts').style.zIndex = 450;
    const renderer = L.canvas({padding: 0.3}), heatR = L.canvas({padding: 0.3, pane: 'heat'}), ptsR = L.canvas({padding: 0.3, pane: 'pts'});
    const layers = {};
    const contourPts = () => BASE.ring.length ? BASE.ring.map(([x, y]) => [y, x]) : null;
    function dessinerFond() {

    const limites = () => {

    const largeur = () => matchMedia('(max-width: 900px)').matches ? 20 : 440;
    const cadrer = () => map.fitBounds(bounds, {paddingTopLeft: [24, 60], paddingBottomRight: [largeur(), 60]});
    cadrer();

    const tuiles = meta.pays === 'FR'

    $('aerien').addEventListener('click', e => {
      state.aerien = !state.aerien;

    let siteM, circR, autres = [];
    function dessinerSite() {

      const c = state.aerien ? '#ffffff' : css('--site');
      circR = L.circle([site.lat, site.lon], {renderer: ptsR, radius: site.r * 1000, color: c, weight: .8, opacity: .55, fillColor: c, fillOpacity: .02, interactive: false}).addTo(map);
      siteM = L.marker([site.lat, site.lon], {icon: L.divIcon({className: 'site-ic', html: `<div class="tag">Unité${state.plan.length > 1 && !state.manuel ? ' ' + (state.siteIndex + 1) : ''}</div><div class="pt"></div>`, iconSize: [20, 20], iconAnchor: [10, 10]}), draggable: true, title: 'Site de l’unité : faites-le glisser', zIndexOffset: 1000}).addTo(map);
      siteM.on('drag', e => circR.setLatLng(e.target.getLatLng()));

    }

    // ---- points
    const rayonPoint = o => { const r = o.inc ? 5.5 : Math.min(15, 2.5 + Math.sqrt(o.mid) * 1.6); return prioDe(o) === 3 ? Math.max(2.5, r * .7) : r; };
    const tonTxt = o => o.inc ? 'à demander' : `${o.fiab === 'ratio' ? '≈ ' : ''}${fmt(o.mid)} t`;
    const BASE_COURTE = {base: 'taille connue', effectif: 'd\'après l\'effectif déclaré', ratio: 'taille moyenne, à confirmer'};
    const markers = new Map();
    function fichePopup(o) {
      const g = `https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lon}`;

       ${o.seg !== 'exclu' ? `<div class="suivi"><label for="sv">Suivi</label><select id="sv" data-suivi="${esc(o.id)}">${Object.entries(SUIVI).map(([k, l]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
       <div class="acts">${contact ? `<button class="link" data-msg="${esc(o.id)}">Copier un message de contact</button>` : ''}<a href="${g}" target="_blank" rel="noopener">Google Maps</a>${o.web ? `<a href="${esc(o.web)}" target="_blank" rel="noopener">Site web</a>` : ''}</div>
       <details><summary>Détails</summary><div>
        ${o.inc ? '' : `<p>Fourchette : <b>${fmt(o.tmin)} à ${fmt(o.tmax)} t/an</b></p>`}
        <p>Déchets : <b>${esc(o.waste)}</b></p>
        ${o.seg !== 'exclu' ? `<p>Disponible : <b>${esc(CAL[o.prof].label)}</b></p>` : ''}
        ${o.sb ? `<p>Score = 100 × ${esc(o.sdet)}, distance ×${coefD(o).toFixed(2).replace('.', ',')}</p>` : ''}
        <p>Source : ${esc(o.source)}. ${esc(FIAB[o.fiab])}. ${esc(ST_LABEL[o.status] || '')}.${osm ? ` <a href="${osm}" target="_blank" rel="noopener">Fiche OSM</a>` : ''}</p>
        ${o.notes.length ? `<ul>${o.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
        ${o.addr ? `<button class="link" data-copy="${esc(o.addr)}">Copier l'adresse</button>` : ''}
       </div></details></div>`;
    }
    function dessinerPoints() {
      markers.forEach(m => map.removeLayer(m)); markers.clear();
      [...DATA].sort((a, b) => (prioDe(b) || 4) - (prioDe(a) || 4) || a.mid - b.mid).forEach(o => {
        let m;
        if (o.key === 'collectivite') m = L.circleMarker([o.lat, o.lon], {renderer: ptsR, radius: Math.min(26, 5 + Math.sqrt(o.pop || 0) / 7), color: css('--accent'), weight: 1, dashArray: '3 3', fillColor: css('--accent')});
        else m = L.circleMarker([o.lat, o.lon], {renderer: ptsR, radius: rayonPoint(o), color: css('--surface'), weight: .8, fillOpacity: .95});

        m.on('click', e => { L.DomEvent.stopPropagation(e); surligner(o.id); });
        m.addTo(map); markers.set(o.id, m);
      });
      rafraichirCarte();
    }
    function rafraichirCarte() {
      const col = [css('--exclu'), css('--p1'), css('--p2'), css('--p3')];

        const m = markers.get(o.id); if (!m) return;
        if (!montre(o)) { map.removeLayer(m); return; }

        const dedans = o.d <= site.r;
        if (o.key === 'collectivite') m.setStyle({opacity: dedans ? .55 : .2, fillOpacity: dedans ? .1 : .03});
        else m.setStyle({fillColor: col[prioDe(o)], fillOpacity: dedans ? .95 : .35, radius: rayonPoint(o)});

    }

    // ---- calculs
    function capter(lat, lon, r, avecCollecte = null) {
      let tmin = 0, tmax = 0, n = 0, wd = 0, mid = 0, coll = 0;

    }
    function peindreSite() {
      cote();

      $('rt').textContent = fmt0(c.mid);
      $('fourchette').textContent = `${c.n} producteurs · de ${fmt0(c.tmin)} à ${fmt0(c.tmax)} t/an`;
      const v = $('verdict');
